appId: com.internal.fmb-diff-merge-checker
productName: FMB Diff & Merge Checker
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: FMB-Diff-Merge-Checker-Setup.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
